# Git hooks, run by prek (https://prek.j178.dev); the file is pre-commit compatible.
# Install once with `mise run setup`. Run everything with `mise run precommit`.
#
# Fast, file-level checks run on every commit, and the commit message is
# checked against Conventional Commits (cog.toml). The test suite runs on push.
# `.beads/` is bd's: it writes those files itself (metadata.json without a final
# newline, the issues export), so the file fixers leave them alone.

minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: ^(\.beads/|Cargo\.lock$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (pedantic, -D warnings)
        entry: env RUSTFLAGS=-Dwarnings cargo clippy --all-targets --all-features
        language: system
        types: [rust]
        pass_filenames: false

      - id: markdown-frontmatter
        name: markdown frontmatter (title, description)
        entry: scripts/check-frontmatter.sh
        language: script
        files: ^docs/.*\.md$

      - id: llms-txt
        name: llms.txt matches the nav and frontmatter
        entry: scripts/gen-llms-txt.sh --check
        language: script
        files: ^(README\.md|mkdocs\.yml|docs/.*\.(md|txt)|scripts/gen-llms-txt\.sh)$
        pass_filenames: false

      - id: no-dotenv
        name: never commit .env files
        entry: 'refusing to commit a .env file; keep secrets local (see .env.example)'
        language: fail
        files: ^\.env(\..*)?$
        exclude: ^\.env\.example$

      - id: conventional-commit
        name: conventional commit message (cog verify)
        entry: cog verify --ignore-merge-commits --file
        language: system
        stages: [commit-msg]

      - id: cargo-test
        name: cargo test (pre-push)
        entry: cargo test --all-features
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
