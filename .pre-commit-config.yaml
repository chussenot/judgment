# Git hooks, run by prek (https://prek.j178.dev); the file is pre-commit compatible.
# Install once with `mise run setup`. Run everything with `mise run precommit`.
#
# Fast, file-level checks run on every commit, and the commit message is
# checked against Conventional Commits (cog.toml). The test suite runs on push.
# `.beads/` is bd's: it writes those files itself (metadata.json without a final
# newline, the issues export), so the file fixers leave them alone. The export is
# imported into the database before every commit and after a merge or a checkout
# (scripts/bd-sync.sh): before the commit because beads' own pre-commit hook then
# exports the database over the file, and a merge resolved by hand has the file
# ahead of the database until it is imported.

minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push, post-merge, post-checkout]
default_stages: [pre-commit]
exclude: ^(\.beads/|Cargo\.lock$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # GitHub Actions and Dependabot configuration, audited for template
  # injection, broad permissions, unpinned actions and persisted credentials
  # (https://docs.zizmor.sh/audits/); offline, so no token is needed.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]

  # A secret in the staged changes stops the commit: the keys in .env are live,
  # and agents commit here. CI runs the hooks on all files, where nothing is
  # staged; the history was scanned whole once (259 commits, clean, 2026-10-25).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (pedantic, -D warnings)
        entry: env RUSTFLAGS=-Dwarnings scripts/cargo-via-mise.sh clippy --all-targets --all-features
        language: system
        types: [rust]
        pass_filenames: false

      - id: markdown-frontmatter
        name: markdown frontmatter (title, description)
        entry: scripts/check-frontmatter.sh
        language: script
        files: ^docs/.*\.md$

      - id: skill-length
        name: a plugin skill's SKILL.md stays under 500 lines
        entry: scripts/check-skill-length.sh
        language: script
        files: ^plugins/jud/skills/[^/]+/SKILL\.md$

      - id: llms-txt
        name: llms.txt matches the nav and frontmatter
        entry: scripts/gen-llms-txt.sh --check
        language: script
        files: ^(README\.md|mkdocs\.yml|docs/.*\.(md|txt)|scripts/gen-llms-txt\.sh)$
        pass_filenames: false

      - id: no-dotenv
        name: never commit .env files
        entry: 'refusing to commit a .env file; keep secrets local (see .env.example)'
        language: fail
        files: ^\.env(\..*)?$
        exclude: ^\.env\.example$

      - id: conventional-commit
        name: conventional commit message (cog verify)
        entry: cog verify --ignore-merge-commits --file
        language: system
        stages: [commit-msg]

      - id: beads-import
        name: beads import (before a commit, after a merge or checkout)
        entry: scripts/bd-sync.sh import
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit, post-merge, post-checkout]

      - id: tools-missing
        name: mise tools this checkout pins and this machine lacks
        entry: scripts/tools-missing.sh
        language: script
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [post-merge, post-checkout]

      - id: cargo-test
        name: cargo test (pre-push)
        entry: scripts/cargo-via-mise.sh test --all-features
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
