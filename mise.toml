wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }
# mise-en-place: tools and tasks for the judgment crate.
# https://mise.jdx.dev — run `mise install` once, then `mise run <task>` (or `mise tasks`).

[tools]
# Keep in step with rust-toolchain.toml, which rustup and CI read. mise must not read that
# file itself: its parser keeps the TOML quotes and rejects the version (mise 2026.9.12).
rust = { version = "1.94.1", components = "rustfmt,clippy" }
mr-boxington = "latest"
prek = "latest"
# Conventional commits and the release bump (cog.toml, docs/releasing.md);
# built from crates.io, the same way CI installs it.
"cargo:cocogitto" = "7.0.0"
# bd (beads), the issue tracker (AGENTS.md, `bd prime`), from the GitHub release
# binary and pinned: the npm package downloads a binary in a postinstall step,
# which fails behind some proxies, and a tool that runs in every git hook
# should not move under `latest`.
"github:gastownhall/beads" = "1.3.1"

[env]
RUST_BACKTRACE = "1"
# Load local secrets when present; never committed (.env is gitignored).
_.file = ".env"

# ---------------------------------------------------------------------------
# Setup
# ---------------------------------------------------------------------------

[tasks.setup]
description = "One-time developer setup: git hooks (prek, the commit-msg check included, then beads) and a warm cargo cache"
run = "scripts/setup-hooks.sh && cargo fetch"

# ---------------------------------------------------------------------------
# Quality gates (what CI runs)
# ---------------------------------------------------------------------------

[tasks.fmt]
description = "Format all Rust sources"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Fail if any source is unformatted"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy on all targets with every feature; pedantic set, warnings are errors"
env = { RUSTFLAGS = "-D warnings" }
run = "cargo clippy --all-targets --all-features"

[tasks.test]
description = "Unit, integration (wiremock), example and doc tests with every feature; no network"
run = "cargo test --all-features"

[tasks."check:minimal"]
description = "The crate and its tests build without the http feature (the no-transport configuration)"
run = "cargo check --no-default-features --all-targets"

[tasks.kani]
description = "The bounded Kani proofs (docs/testing.md, \"Bounded proofs\"); needs `cargo install --locked kani-verifier && cargo kani setup` once"
run = '''
set -eu
cargo kani --no-default-features --harness nearest_index_is_a_level_of_the_scale
cargo kani --no-default-features --harness bin_index_is_a_bin
cargo kani --no-default-features --harness nearest_rank_is_an_index_into_the_values
cargo kani --harness truncate_cuts_on_a_char_boundary_within_the_cap
cargo kani -Z stubbing --harness delay_never_panics_and_stays_within_the_policy
'''

[tasks.doc]
description = "Build API docs; broken links are errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --document-private-items --all-features"

[tasks."docs:check"]
description = "Frontmatter on every page under docs/, and llms.txt matches the nav and frontmatter"
run = """
set -eu
scripts/check-frontmatter.sh docs
scripts/gen-llms-txt.sh --check
"""

[tasks."docs:llms"]
description = "Regenerate docs/llms.txt and docs/llms-full.txt from mkdocs.yml and the page frontmatter"
run = "scripts/gen-llms-txt.sh"

[tasks.check]
description = "All quality gates, in CI order"
depends = ["fmt:check", "lint", "check:minimal", "test", "doc", "docs:check"]

[tasks.precommit]
description = "Run every pre-commit hook against the whole tree"
run = "prek run --all-files"

[tasks.package]
description = "What a publish would ship, without publishing"
run = "cargo package --list"

[tasks."publish:dry"]
description = "Everything cargo publish checks, without publishing; the release workflow runs the same before the real one"
run = "cargo publish --dry-run"

# ---------------------------------------------------------------------------
# Commits and releases (cog.toml, docs/releasing.md)
# ---------------------------------------------------------------------------

[tasks."commits:check"]
description = "Every commit since the latest tag is a Conventional Commit (merge commits ignored), as CI checks a pull request"
run = "cog check"

[tasks."release:dry"]
description = "The version the commits since the latest tag call for, and nothing else"
run = "cog bump --auto --dry-run"

[tasks.release]
description = "Cut a release on an up-to-date main: version into Cargo.toml, Cargo.lock and the CHANGELOG, the gate, a bump commit and a tag; then open the pull request and push the tag by hand (docs/releasing.md)"
run = "cog bump --auto"

[tasks.clean]
description = "Remove the Cargo build output and this checkout's mbx state; the shared cache stays"
run = ["cargo clean", "mbx clean"]

# ---------------------------------------------------------------------------
# Live checks (never part of `check`; the gate stays offline)
# ---------------------------------------------------------------------------

[tasks."live:typesafe"]
description = "The ignored live tests against the hosted TypeSafe API; needs TYPESAFE_API_KEY and spends a few model calls"
run = '''
set -eu
: "${TYPESAFE_API_KEY:?set TYPESAFE_API_KEY (in .env) to run the live tests}"
base="${TYPESAFE_BASE_URL:-https://api.typesafe.ai}"
JUDGMENT_LIVE_BASE_URL="$base" JUDGMENT_LIVE_API_KEY="$TYPESAFE_API_KEY" \
JUDGMENT_LIVE_AUTH_BASE_URL="$base" JUDGMENT_LIVE_AUTH_API_KEY="$TYPESAFE_API_KEY" \
JUDGMENT_LIVE_MODEL="${TYPESAFE_DEFAULT_MODEL:-jev-latest}" \
  cargo test --test live -- --ignored --nocapture --test-threads=1
'''

[tasks."live:ollama"]
description = "The ignored live tests against Ollama's /v1/systemone on OLLAMA_URL (default http://127.0.0.1:11434; Ollama 0.35 or later, `ollama pull tev1:0.8b` first); OLLAMA_MODEL picks another decision model (nimble, tev1, and clef or clef-flash on 0.35.1)"
run = '''
set -eu
base="${OLLAMA_URL:-http://127.0.0.1:11434}"
curl -sSf -m 5 -o /dev/null "$base/api/version" || { echo "no Ollama at $base; start it with 'ollama serve' and pull a decision model ('ollama pull tev1:0.8b')" >&2; exit 1; }
JUDGMENT_LIVE_BASE_URL="$base" JUDGMENT_LIVE_MODEL="${OLLAMA_MODEL:-tev1:0.8b}" \
  cargo test --test live -- --ignored --nocapture --test-threads=1
'''

[tasks."live:clef"]
description = "The ignored live tests against Cloudflare's Clef on Workers AI through tools/systemone/serve.py (CLEF_MODEL=clef-flash for the 9B); needs CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in .env and spends a few model calls"
run = '''
set -eu
: "${CLOUDFLARE_ACCOUNT_ID:?set CLOUDFLARE_ACCOUNT_ID (in .env) to run the live tests against Workers AI}"
: "${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN (in .env) to run the live tests against Workers AI}"
python3 tools/systemone/serve.py cloudflare --port 8099 & shim=$!
python3 tools/systemone/serve.py cloudflare --port 8098 --api-key secret & auth=$!
trap 'kill $shim $auth 2>/dev/null' EXIT
for _ in $(seq 1 50); do
  curl -sf -o /dev/null http://127.0.0.1:8099/v1/models \
    && curl -sf -o /dev/null -H 'Authorization: Bearer secret' http://127.0.0.1:8098/v1/models && break
  sleep 0.2
done
JUDGMENT_LIVE_BASE_URL=http://127.0.0.1:8099 JUDGMENT_LIVE_MODEL="${CLEF_MODEL:-clef}" \
JUDGMENT_LIVE_AUTH_BASE_URL=http://127.0.0.1:8098 JUDGMENT_LIVE_AUTH_API_KEY=secret \
  cargo test --test live -- --ignored --nocapture --test-threads=1
'''

[tasks."live:laya"]
description = "The ignored live tests against a System One-compatible server on LAYA_URL (default http://127.0.0.1:8000, laya-serve); docs/verification/laya-typed-decisions.md says how to start one"
run = '''
set -eu
JUDGMENT_LIVE_BASE_URL="${LAYA_URL:-http://127.0.0.1:8000}" JUDGMENT_LIVE_MODEL="${LAYA_MODEL:-typed-decisions}" \
  cargo test --test live -- --ignored --nocapture --test-threads=1
'''

# ---------------------------------------------------------------------------
# Planning (beads)
# ---------------------------------------------------------------------------

[tasks."jud:check"]
description = "Read .jud documents as the crate reads them and bind cases to their rubric (src/bin/jud.rs); `mise run jud:check -- FILE...`, default: the examples"
run = """sh -c 'if [ $# -eq 0 ]; then set -- examples/jud/*.jud examples/recordings/jud_calibration/*.jud; fi; cargo run -q --features jud --bin jud -- check "$@"' --"""

[tasks."bd:ready"]
description = "Issues ready to work on (bd ready)"
run = "bd ready"

[tasks."bd:export"]
description = "Write every issue to .beads/issues.jsonl, the passive export reviewers read in a pull request"
run = "bd export --all -o .beads/issues.jsonl"
