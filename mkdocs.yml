# Documentation of the judgment crate. Builds as TechDocs for the `judgment`
# Component in catalog-info.yaml (backstage.io/techdocs-ref: dir:.), and is
# the nav scripts/gen-llms-txt.sh reads to write
# docs/llms.txt and docs/llms-full.txt. The pages carry YAML frontmatter;
# mkdocs reads it as page meta. The tree follows Diátaxis
# (docs/project/contributing.md): tutorials, guides, reference, concepts.
site_name: judgment
site_description: Typed, calibrated judgments from TypeSafe System One models (Jev) and compatible backends, as a Rust crate and the jud command line.
repo_url: https://github.com/chussenot/judgment
edit_uri: edit/main/docs/
docs_dir: docs

nav:
  - Overview: index.md
  - Start:
      - Install: start/install.md
      - Your first decision from the command line: start/first-decision-cli.md
      - Your first decision in Rust: start/first-decision-rust.md
  - Guides:
      - Configure a backend: guides/configure-a-backend.md
      - Write a rubric: guides/write-a-rubric.md
      - Label cases: guides/label-cases.md
      - Record, replay and test: guides/record-replay-and-test.md
      - Tune thresholds: guides/tune-thresholds.md
      - Run in CI: guides/run-in-ci.md
      - Run in a container: guides/run-in-a-container.md
      - Use the Claude Code plugin: guides/use-the-claude-code-plugin.md
      - Patterns: guides/patterns.md
  - Reference:
      - The jud command line: reference/cli.md
      - Configuration: reference/configuration.md
      - The .jud format: reference/jud-format.md
      - The crate: reference/crate.md
      - The container image: reference/container-image.md
      - Stability: reference/stability.md
      - Glossary: reference/glossary.md
  - Concepts:
      - System One: concepts/system-one.md
      - Rubrics, cases and recordings: concepts/rubrics-cases-recordings.md
      - How judgment works: concepts/how-judgment-works.md
  - Project:
      - Contributing: project/contributing.md
      - Internals: project/internals.md
      - Releasing: project/releasing.md
      - Verification:
          - How the crate is checked: project/verification/method.md
          - Against the hosted TypeSafe API: project/verification/hosted-typesafe.md
          - Against Laya typed-decisions: project/verification/laya-typed-decisions.md
      - Research:
          - System One client libraries: project/research/system-one-client-libraries.md
          - Compatible servers and models: project/research/compatible-servers-and-models.md
          - Compared with the other Rust clients: project/research/client-comparison.md
          - System One models on Google Cloud: project/research/system-one-on-google-cloud.md
      - Decisions:
          - Index: project/decisions/README.md
          - 0003 Typed handles between questions and answers: project/decisions/0003-typed-handles-between-questions-and-answers.md
          - 0013 Releases cut with cocogitto and published from CI: project/decisions/0013-releases-cut-with-cocogitto-and-published-from-ci.md
          - 0014 A file format for rubrics, cases and recordings: project/decisions/0014-a-file-format-for-rubrics-cases-and-recordings.md
          - 0016 The .jud format takes minor versions: project/decisions/0016-jud-takes-minor-versions.md
          - 0017 The .jud format 1.2 refuses what a reviewer cannot see: project/decisions/0017-jud-1-2-refuses-what-a-reviewer-cannot-see.md
          - 0018 The .jud format 1.3 takes the manifest envelope: project/decisions/0018-jud-1-3-takes-the-manifest-envelope.md
          - 0019 A command line for the format, released as a binary: project/decisions/0019-a-command-line-for-the-format.md
          - 0020 How a v1 minor of the .jud format is spelled: project/decisions/0020-how-a-v1-minor-is-spelled.md

# Pages link to files outside docs/ (the examples, the README, the CHANGELOG)
# by relative path, the repository's convention, which GitHub and crates.io
# render; a TechDocs site does not carry those files. mkdocs would refuse the
# build for them in strict mode, so the check is informational here and
# `mise run docs:links` (lychee, offline) is what holds every link, anchors
# included, to a file that exists.
validation:
  links:
    not_found: info
    unrecognized_links: info

plugins:
  - techdocs-core

# Mermaid fences render in GitHub natively; in Backstage they need the TechDocs
# Mermaid addon.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
