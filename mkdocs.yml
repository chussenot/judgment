# Documentation of the judgment crate. Builds as TechDocs for the `judgment`
# Component in catalog-info.yaml (backstage.io/techdocs-ref: dir:.), and is
# the nav scripts/gen-llms-txt.sh reads to write
# docs/llms.txt and docs/llms-full.txt. The pages carry YAML frontmatter;
# mkdocs reads it as page meta.
site_name: judgment
site_description: Typed, calibrated judgments from TypeSafe System One models (Jev) and compatible backends, as a Rust crate.
repo_url: https://github.com/chussenot/judgment
edit_uri: edit/main/docs/
docs_dir: docs

nav:
  - Overview: index.md
  - How judgment works: design.md
  - What is in the crate: tour.md
  - How the crate is implemented: implementation.md
  - Patterns: patterns.md
  - Testing without the model: testing.md
  - The .jud format: jud.md
  - What a rubric is: rubric.md
  - Releasing: releasing.md
  - Verification:
      - How the crate is checked: verification/method.md
      - Against the hosted TypeSafe API: verification/hosted-typesafe.md
      - Against Laya typed-decisions: verification/laya-typed-decisions.md
  - Research:
      - System One client libraries: research/system-one-client-libraries.md
      - Compatible servers and models: research/compatible-servers-and-models.md
      - Compared with the other Rust clients: research/client-comparison.md
  - Decisions:
      - Index: decisions/README.md
      - 0003 Typed handles between questions and answers: decisions/0003-typed-handles-between-questions-and-answers.md
      - 0013 Releases cut with cocogitto and published from CI: decisions/0013-releases-cut-with-cocogitto-and-published-from-ci.md
      - 0014 A file format for rubrics, cases and recordings: decisions/0014-a-file-format-for-rubrics-cases-and-recordings.md
      - 0016 The .jud format takes minor versions: decisions/0016-jud-takes-minor-versions.md
      - 0017 The .jud format 1.2 refuses what a reviewer cannot see: decisions/0017-jud-1-2-refuses-what-a-reviewer-cannot-see.md

plugins:
  - techdocs-core

# Mermaid fences render in GitHub natively; in Backstage they need the TechDocs
# Mermaid addon.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
