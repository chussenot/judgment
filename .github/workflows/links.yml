# The documentation's external links, once a week and on demand. The internal
# links are checked on every change by the ci workflow (lychee --offline);
# this run fetches the external ones, which can go stale without a change
# here, and opens nothing: a failure is read on the run.
name: links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    name: lychee, online
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml README.md docs plugins
          fail: true
