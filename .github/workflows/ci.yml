name: CI

# The crate's gate: the steps of `mise run check`, then what a publish would
# ship, and the commit convention on a pull request. Only GitHub-owned actions
# are used (actions/checkout, actions/cache), each pinned to a commit SHA
# with its release in a comment for Dependabot; the toolchain comes from
# rust-toolchain.toml via rustup, prek is installed with pipx and cocogitto
# from crates.io, so the workflow runs under a repository policy that forbids
# third-party actions. The release workflow calls this one on a tag
# (workflow_call), so a publish never runs on a commit the gate did not pass.
#
# Four jobs guard what a user of the crate depends on, each a `mise run` task
# of the same name: `semver` (the public API against the latest crates.io
# release), `deny` (licences, advisories, duplicate versions, sources:
# deny.toml), `msrv` (the declared minimum Rust version builds) and `hack`
# (every feature builds on its own). The tools they need are installed from
# crates.io at the versions mise.toml pins, cached by version like cocogitto,
# instead of through the tools' own third-party actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Read-only by default (zizmor's excessive-permissions): no job here writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, doc, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
          cargo --version
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      # The crate must build without its `http` feature, for a project that
      # brings its own transport; its tests are checked too.
      - run: cargo check --no-default-features --all-targets
      # Snapshots (tests/snapshots/): a changed one fails and a pending one
      # is refused, never written; `cargo insta review` accepts a change.
      - run: cargo test --all-features
        env:
          INSTA_UPDATE: "no"
      # The benchmarks compile; their numbers are for a person on a quiet
      # machine (docs/reference/performance.md), not for a shared runner.
      - run: cargo bench --no-run
      # The README's opening example, run without the `http` feature: no
      # client is compiled in, so it cannot need a key or the network.
      - run: cargo run --example quickstart --no-default-features
      # The README's second example, the same questions as a .jud rubric.
      - run: cargo run --example jud_quickstart --features jud
      - run: cargo doc --no-deps --document-private-items --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # The documentation gate (docs/project/contributing.md): frontmatter,
      # the generated pages against their sources, the .jud documents the
      # pages show, and every internal link.
      - run: scripts/check-frontmatter.sh docs
      - run: scripts/gen-llms-txt.sh --check
      - run: scripts/gen-cli-reference.sh --check
      - run: scripts/gen-plugin-format.sh --check
      - run: scripts/gen-plugin-rust.sh --check
      - run: cargo run -q --features cli --bin jud -- check examples/jud/*.jud examples/recordings/jud_calibration/*.jud
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --offline README.md docs plugins
          fail: true
      # What a publish would ship, so tooling creeping into the package is seen.
      - run: cargo package --list --allow-dirty

  semver:
    name: public API against the last release (cargo-semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tool-cache
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-${{ runner.os }}-0.51.0

      - name: Install cargo-semver-checks
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-semver-checks --locked --version 0.51.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-semver-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-semver-${{ runner.os }}-

      # The baseline is the latest release on crates.io; the version in
      # Cargo.toml says which kind of change is allowed (0.x: a minor bump may
      # break, a patch may not), so the same command guards a release bump
      # (cog.toml) and an ordinary change.
      - run: cargo semver-checks check-release --all-features

  deny:
    name: licences, advisories, bans, sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tool-cache
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.20.2

      - name: Install cargo-deny
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.20.2

      - run: cargo deny --all-features check advisories licenses bans sources

  msrv:
    name: minimum supported Rust version (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the minimum supported toolchain
        run: rustup toolchain install 1.91 --profile minimal

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-msrv-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-msrv-${{ runner.os }}-

      # `rust-version` in Cargo.toml is a promise to users; this is where it is
      # kept. The locked dependencies are the ones the gate above tested.
      - run: cargo +1.91 check --all-features --locked

  hack:
    name: every feature on its own (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tool-cache
        with:
          path: ~/.cargo/bin/cargo-hack
          key: cargo-hack-${{ runner.os }}-0.6.45

      - name: Install cargo-hack
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-hack --locked --version 0.6.45

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-hack-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-hack-build-${{ runner.os }}-

      - run: cargo hack check --each-feature --no-dev-deps
      # `http` implies `pacer`, so the two are one group: every combination of
      # the other features, with and without the client.
      - run: cargo hack check --feature-powerset --group-features http,pacer --no-dev-deps

  hooks:
    name: pre-commit hooks (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install prek
        run: |
          pipx install prek
          prek --version

      # The cargo hooks already run in the check job; the commit-msg hook
      # runs in the commits job, over the pull request's commits.
      - name: Run hooks on all files
        run: prek run --all-files --hook-stage pre-commit
        env:
          SKIP: cargo-fmt,cargo-clippy

  commits:
    name: conventional commits (cog check)
    # The commits a pull request adds; main takes changes only through pull
    # requests, so this is every commit that reaches it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # cocogitto is built from crates.io, pinned to the version mise.toml
      # names, and cached by that version: no third-party action, no binary
      # fetched from a release page.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cog-cache
        with:
          path: ~/.cargo/bin/cog
          key: cog-${{ runner.os }}-7.0.0

      - name: Install cocogitto
        if: steps.cog-cache.outputs.cache-hit != 'true'
        run: cargo install cocogitto --locked --version 7.0.0

      - name: Check the pull request's commits
        env:
          BASE: ${{ github.base_ref }}
        run: |
          cog --version
          cog check --ignore-merge-commits "origin/$BASE..HEAD"

  docs:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-techdocs-core
      - run: mkdocs build --strict --site-dir target/site
