name: Release

# Publishes the crate to crates.io and the `jud` binaries to a GitHub release
# from a pushed `v*` tag, which `cog bump` creates (cog.toml; docs/project/releasing.md
# is the runbook, decision 0013 the why, decision 0019 the binary). The gate
# runs first, through the CI workflow, on the tagged commit; the tag must name
# the version in Cargo.toml; `cargo publish --dry-run` must pass; the binary is
# built, checked and packaged on every platform it ships for; then the publish,
# and a GitHub release whose notes are the CHANGELOG's section for the version
# and whose assets are the tarballs and their checksums; last, the Homebrew
# formula is rendered from those checksums and committed to the tap, and the
# container image is built from the Linux tarballs and pushed to ghcr.io. Only
# GitHub-owned actions and the runner's own tools (rustup, cargo, curl, jq, gh,
# git, docker) are used.
#
# The binary legs follow github.com/chussenot/pact's release workflow: native
# runners only (no cross-compilation, so every leg runs the binary it built),
# one asset per platform named `jud-<tag>-<triple>.tar.gz` so a tool manager
# resolves it unambiguously (`mise use -g github:chussenot/judgment@latest`),
# a `SHA256SUMS` over the set, and a build-provenance attestation.
#
# A `workflow_dispatch` is a dry run: it builds and packages every leg from the
# ref it runs on, renders the formula, builds and runs the image, and
# publishes nothing, so the pipeline can be exercised without cutting a tag.
# The publish job, the commit to the tap and the push of the image run on a
# tag push only.
#
# Credential, in this order:
# - the CARGO_REGISTRY_TOKEN secret, when set: needed for the first release,
#   because crates.io lets a trusted publisher be configured only on a crate
#   that already exists;
# - otherwise a short-lived token from crates.io trusted publishing, exchanged
#   for this job's OIDC identity (repository chussenot/judgment, workflow
#   release.yml, environment crates-io, as configured on the crate's settings
#   page) and revoked when the job ends. Once that is configured, delete the
#   secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    uses: ./.github/workflows/ci.yml


  build:
    name: jud ${{ matrix.target.triple }}
    needs: gate
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      # One broken target must not hide the state of the others.
      fail-fast: false
      matrix:
        target:
          # musl is static: one binary for any Linux, glibc or not, and for a
          # `FROM scratch` image. Native ARM runners build the arm64 leg.
          - triple: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - triple: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          # Apple silicon. Intel macOS has no native runner any more and is
          # not cross-compiled, so that every leg runs what it built; an
          # Intel Mac installs from crates.io (`cargo install judgment`).
          - triple: aarch64-apple-darwin
            os: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml, with the target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target.triple }}
          cargo --version

      # rustls through ring compiles a little C; musl needs its own gcc for it.
      - name: Install the musl toolchain
        if: matrix.target.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # --locked: the artifact resolves the lockfile the tag carries, not
      # whatever cargo would pick on the day. `--features cli` is the binary's
      # own feature (the format, the client and clap), named so that the
      # artifact's contents are a promise rather than a default.
      - name: Build
        run: cargo build --release --locked --features cli --bin jud --target ${{ matrix.target.triple }}

      # Strip before checking, so what is checked is what is packaged. On
      # macOS the linker's ad-hoc signature does not survive strip and an
      # unsigned arm64 binary is killed on exec, so it is re-signed ad hoc.
      - name: Strip
        run: |
          set -eu
          bin="target/${{ matrix.target.triple }}/release/jud"
          before=$(wc -c <"$bin")
          strip "$bin"
          case "${{ matrix.target.triple }}" in
            *-apple-darwin) codesign --sign - --force "$bin" ;;
          esac
          echo "stripped: $before -> $(wc -c <"$bin") bytes"

      # The binary that will be packaged, run on the runner that built it:
      # it reports the manifest's version, reads the example documents the
      # way the library does, and resolves its backend without a network.
      - name: Check the binary
        run: |
          set -eu
          bin="target/${{ matrix.target.triple }}/release/jud"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "judgment") | .version')
          "$bin" --version | tee /dev/stderr | grep -qF "jud $version"
          "$bin" check examples/jud/triage.jud examples/jud/triage-cases.jud examples/recordings/jud_calibration/receipt.jud
          XDG_CONFIG_HOME="$RUNNER_TEMP/xdg" "$bin" config | jq -e '.base_url == "https://api.typesafe.ai" and .api_key == "missing"'
          echo '{"message": "hi"}' | XDG_CONFIG_HOME="$RUNNER_TEMP/xdg" "$bin" examples/jud/triage.jud 2>&1 | grep -q "no API key"
          "$bin" completion bash | grep -q "complete -F _jud"

      - name: Package
        id: package
        run: |
          set -eu
          name="jud-${GITHUB_REF_NAME}-${{ matrix.target.triple }}"
          # On a dry run the ref is a branch; the name says so rather than
          # looking like a release.
          case "$GITHUB_REF_NAME" in v*) ;; *) name="jud-dryrun-${{ matrix.target.triple }}" ;; esac
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target.triple }}/release/jud" README.md CHANGELOG.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "dist/$name.tar.gz"

      # `cargo binstall judgment` downloads the tarball the crate's
      # [package.metadata.binstall] templates name (Cargo.toml); rendered
      # here the way binstall renders them, they must name this very tarball
      # and the binary's path inside it, or a published version would send
      # binstall to a 404 and a source build.
      - name: The binstall metadata names this tarball
        run: |
          set -eu
          meta=$(cargo metadata --no-deps --format-version 1 | jq -c '.packages[] | select(.name == "judgment") | {version, repository, binstall: .metadata.binstall}')
          version=$(jq -r .version <<<"$meta")
          render() {
            jq -r "$1" <<<"$meta" \
              | sed -e "s|{ repo }|$(jq -r .repository <<<"$meta")|g" \
                    -e "s|{ version }|$version|g" \
                    -e "s|{ target }|${{ matrix.target.triple }}|g" \
                    -e "s|{ bin }|jud|g"
          }
          url=$(render .binstall\[\"pkg-url\"\])
          bin=$(render .binstall\[\"bin-dir\"\])
          fmt=$(jq -r '.binstall["pkg-fmt"]' <<<"$meta")
          echo "pkg-url  $url"; echo "bin-dir  $bin"; echo "pkg-fmt  $fmt"
          expected="jud-v$version-${{ matrix.target.triple }}"
          [ "$url" = "https://github.com/chussenot/judgment/releases/download/v$version/$expected.tar.gz" ] || { echo "::error::pkg-url renders to '$url', not the release asset $expected.tar.gz"; exit 1; }
          [ "$bin" = "$expected/jud" ] || { echo "::error::bin-dir renders to '$bin', not $expected/jud"; exit 1; }
          [ "$fmt" = tgz ] || { echo "::error::pkg-fmt is '$fmt', the tarball is .tar.gz"; exit 1; }
          # On a tag the packaged tarball is the asset itself: the path must be in it.
          case "$GITHUB_REF_NAME" in
            v*) tar -tzf "dist/${{ steps.package.outputs.name }}.tar.gz" | grep -qx "$bin" || { echo "::error::$bin is not in the tarball"; exit 1; } ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish to crates.io and the GitHub release
    needs: [gate, build]
    # A tag push only: a dry run builds and publishes nothing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Protect the environment in the repository settings (required reviewers,
    # a deployment branch rule for tags) to put a person in front of a publish.
    environment: crates-io
    permissions:
      contents: write      # the GitHub release
      id-token: write      # crates.io trusted publishing, and the attestation
      attestations: write  # build provenance on the tarballs
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - name: The tag names the version in Cargo.toml
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "judgment") | .version')
          echo "tag v$tag_version, Cargo.toml $manifest_version"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name the manifest version $manifest_version; cut releases with cog bump (docs/project/releasing.md)"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      # Written outside the checkout: `cargo publish` refuses a working tree
      # with an uncommitted file, and --allow-dirty would hide a real one.
      - name: The CHANGELOG has a section for the version
        run: |
          version='${{ steps.version.outputs.version }}'
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '^- ' "$notes"; then
            echo "::error::CHANGELOG.md has no entries under '## [$version]'"
            exit 1
          fi
          echo "release notes:"; cat "$notes"
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::the checkout is not clean; cargo publish would refuse it"; exit 1; }

      - run: cargo publish --dry-run --locked

      - name: Credential for crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "using the CARGO_REGISTRY_TOKEN secret"
            echo "CARGO_REGISTRY_TOKEN=$CARGO_REGISTRY_TOKEN" >> "$GITHUB_ENV"
            echo "TRUSTED_PUBLISHING_TOKEN=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "no CARGO_REGISTRY_TOKEN secret; exchanging this job's OIDC identity with crates.io trusted publishing"
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crates.io" | jq -r '.value')
          token=$(curl -sSf -X PUT https://crates.io/api/v1/trusted_publishing/tokens \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -H 'User-Agent: judgment release workflow (github.com/chussenot/judgment)' \
            -d "$(jq -cn --arg jwt "$jwt" '{jwt: $jwt}')" | jq -r '.token')
          [ -n "$token" ] && [ "$token" != null ] || { echo "::error::crates.io returned no token; is the trusted publisher configured for this workflow and environment?"; exit 1; }
          echo "::add-mask::$token"
          echo "CARGO_REGISTRY_TOKEN=$token" >> "$GITHUB_ENV"
          echo "TRUSTED_PUBLISHING_TOKEN=$token" >> "$GITHUB_ENV"

      - run: cargo publish --locked

      - name: Revoke the trusted-publishing token
        if: always() && env.TRUSTED_PUBLISHING_TOKEN != ''
        run: |
          curl -sS -X DELETE https://crates.io/api/v1/trusted_publishing/tokens \
            -H "Authorization: Bearer $TRUSTED_PUBLISHING_TOKEN" \
            -H 'User-Agent: judgment release workflow (github.com/chussenot/judgment)' \
            -o /dev/null -w 'revoke: HTTP %{http_code}\n' || true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Every leg into one directory rather than one subdirectory each.
          merge-multiple: true

      # Basenames only, in the shell's sorted order, so the file is the same
      # for the same inputs and `sha256sum -c SHA256SUMS` works wherever the
      # tarballs were downloaded to; checked here before anyone else has to.
      - name: Checksum every tarball
        run: |
          set -eu
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # Which workflow, commit and run produced each tarball, for
      # `gh attestation verify <tarball> --repo chussenot/judgment`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: GitHub release with the CHANGELOG section as notes and the binaries as assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "judgment ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            dist/*.tar.gz dist/SHA256SUMS

  homebrew:
    name: the formula into the tap
    needs: [build, publish]
    # After a publish on a tag; on a dry run the formula is rendered from the
    # dry-run tarballs and printed, and nothing is committed.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The same bytes the release carries (checked there): the formula's
      # checksums are computed here from them, not copied.
      - name: Render Formula/jud.rb from the tarballs
        id: render
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "judgment") | .version')
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          scripts/homebrew-formula.sh "$version" dist/SHA256SUMS > "$RUNNER_TEMP/jud.rb"
          ruby -c "$RUNNER_TEMP/jud.rb"
          cat "$RUNNER_TEMP/jud.rb"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # One commit on the tap's main, "jud X.Y.Z" as Homebrew names a version
      # bump, pushed with HOMEBREW_TAP_TOKEN: a fine-grained token whose only
      # permission is contents read and write on chussenot/homebrew-tap
      # (docs/project/releasing.md, one-time setup). The tap's own CI then audits,
      # installs and tests the formula from the published tarballs.
      - name: Commit to chussenot/homebrew-tap
        if: github.event_name == 'push'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          set -eu
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::no HOMEBREW_TAP_TOKEN secret: the release is published but the tap was not updated; add the token (docs/project/releasing.md) and re-run this job"
            exit 1
          fi
          git clone --quiet --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/chussenot/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Formula
          cp "$RUNNER_TEMP/jud.rb" Formula/jud.rb
          git add Formula/jud.rb
          if git diff --cached --quiet; then
            echo "the tap already carries jud $VERSION; nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "jud $VERSION" \
              -m "Rendered by scripts/homebrew-formula.sh from the checksums of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME} (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          git push --quiet origin HEAD
          echo "pushed jud $VERSION to chussenot/homebrew-tap"

  image:
    name: the container image to ghcr.io
    needs: [build, publish]
    # After a publish on a tag; on a dry run the image is built from the
    # dry-run tarballs, run, and not pushed.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write      # ghcr.io/chussenot/jud
      id-token: write      # the attestation
      attestations: write  # build provenance on the image
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The build context: the two Linux binaries out of the tarballs the
      # release carries (never a second compilation), the non-root user, and
      # the runner's CA bundle for the client's TLS (Dockerfile says why).
      - name: Fill the build context from the tarballs
        id: context
        run: |
          set -eu
          scripts/image-context.sh --dist dist
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "judgment") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The multi-platform image needs a builder that is not the daemon's
      # default (which loads one platform at a time); QEMU is not needed, no
      # instruction of the other platform ever runs: the binaries are copied.
      - name: A multi-platform builder
        run: docker buildx create --use --name release --driver docker-container

      # The platform of the runner, loaded into the daemon and run the way a
      # user runs it: the version, a document read, a keyless run refused
      # with status 2, and the replay of a recorded case through a mounted
      # directory, all as the image's non-root user.
      - name: Build the runner's platform and run it
        env:
          VERSION: ${{ steps.context.outputs.version }}
        run: |
          set -eu
          docker buildx build --load --platform linux/amd64 -t "$IMAGE:check" .
          docker run --rm "$IMAGE:check" --version | tee /dev/stderr | grep -qF "jud $VERSION"
          docker run --rm -v "$PWD/examples/jud:/work:ro" "$IMAGE:check" check triage.jud triage-cases.jud
          docker run --rm "$IMAGE:check" config | jq -e '.api_key == "missing" and .config_file == "/home/jud/.config/jud/config.yaml"'
          status=0; echo '{"message": "hi"}' | docker run -i --rm -v "$PWD/examples/jud:/work:ro" "$IMAGE:check" triage.jud 2>&1 | grep -q "no API key" || status=$?
          [ "$status" -eq 0 ]
          printf '%s' '{"message": "This is the third time I'"'"'m writing. I was charged twice last month and nobody has refunded me. Fix it today or I cancel."}' \
            | docker run -i --rm -v "$PWD/examples:/work:ro" -e JUD_REPLAY=/work/recordings/jud_calibration "$IMAGE:check" jud/triage.jud \
            | jq -e '.desk.key == "billing" and .tone.label == "angry"'
          docker run --rm --entrypoint /usr/local/bin/jud "$IMAGE:check" completion bash | grep -q "complete -F _jud"
          docker image inspect "$IMAGE:check" --format 'user {{.Config.User}}, {{.Size}} bytes'

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # One manifest list for both platforms, tagged with the version, its
      # major.minor and latest; pushed with the job's own token, which can
      # write packages of this repository and nothing else. On a dry run the
      # same build runs to the end without --push, so a broken context or
      # Dockerfile is found before a tag.
      - name: Build both platforms, push on a tag
        id: push
        env:
          VERSION: ${{ steps.context.outputs.version }}
        run: |
          set -eu
          minor=${VERSION%.*}
          tags="-t $IMAGE:$VERSION -t $IMAGE:$minor -t $IMAGE:latest"
          out=""
          case "$GITHUB_EVENT_NAME" in
            push) out="--push --metadata-file $RUNNER_TEMP/image.json" ;;
          esac
          # shellcheck disable=SC2086
          docker buildx build --platform linux/amd64,linux/arm64 $tags \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.title=jud" \
            --label "org.opencontainers.image.description=Evaluate JSON against a .jud rubric with a calibrated System One model" \
            --provenance=false --sbom=false \
            $out .
          if [ -n "$out" ]; then
            digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.json")
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "pushed $IMAGE@$digest as $VERSION, $minor, latest"
          fi

      # Which workflow, commit and run produced the image, for
      # `gh attestation verify oci://ghcr.io/chussenot/jud:X.Y.Z --repo chussenot/judgment`.
      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
