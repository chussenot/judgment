# Rewrites of the better answer of each pairwise-judge-cases.jud case, for
# `jud eval --tone-perturb`: the same content in one of the four tones
# CALM's sentiment test uses (cheerful, sad, angry, fearful; Ye et al.,
# arXiv 2410.02736), in turn by case. Written for this example, not part
# of LLMBar: the content of each better answer is kept as it is and a tone
# is put around it, so a judge that follows content picks it still. The
# comment above each names its tone.
# cheerful
llmbar-natural-001:
  better: "Oh, this is such a fun one! He learned his weather report. He prepared for his forecast. He expected the forecast would be wrong. Yet when the forecast report came back positive! Hooray for happy endings!"
