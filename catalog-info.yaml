# Backstage catalog entry for the judgment crate. Register this file's URL in
# the catalog (or via the GitHub discovery provider) and the library, its
# TechDocs (docs/) and its dependency show up in the portal; signalman's own
# catalog-info.yaml depends on this Component.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: judgment
  title: judgment
  description: >-
    Rust crate for typed, calibrated judgments from TypeSafe System One
    models (Jev) and compatible backends: typed questions and answers, the
    HTTP client with SDK-default retries, record and replay, evaluation.
  tags:
    - rust
    - library
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: chussenot/judgment
  links:
    - url: https://github.com/chussenot/judgment
      title: Repository
      icon: github
    - url: https://docs.typesafe.ai
      title: TypeSafe docs
      icon: docs
spec:
  type: library
  lifecycle: experimental
  # Replace with the group that maintains the crate in your catalog.
  owner: group:default/platform-engineering
  dependsOn:
    - resource:default/typesafe-api
