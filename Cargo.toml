[package]
name = "judgment"
version = "0.14.0"
description = "Typed, calibrated judgments from TypeSafe System One models (Jev) and compatible backends: questions with typed handles, validated probabilities, SDK-default retries, differences stated"
readme = "README.md"
keywords = ["typesafe", "system-one", "jev", "classification", "calibration"]
categories = ["api-bindings", "web-programming::http-client"]
# Published to crates.io by CI from a pushed `v*` tag, and only from there
# (.github/workflows/release.yml, docs/project/releasing.md); the version is written
# by `cog bump`, never by hand (cog.toml, decision 0013).
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/chussenot/judgment"
# What a package does not ship: the repository's own tooling. The docs, the
# examples with their recordings and the vendored OpenAPI document stay in
# (`cargo package --list` shows the result; CI runs it).
exclude = [
    ".github/",
    ".claude/",
    # The jud plugin and the marketplace that serves it (docs/guides/use-the-claude-code-plugin.md).
    ".claude-plugin/",
    "plugins/",
    "CLAUDE.md",
    # The issue tracker and the agent integrations `bd init` installs.
    ".beads/",
    ".agents/",
    ".codex/",
    ".cursor/",
    "AGENTS.md",
    "catalog-info.yaml",
    "mise.toml",
    "cog.toml",
    ".pre-commit-config.yaml",
    "scripts/",
    # The System One shim and the benchmark export (Python, docs/project/verification).
    "tools/",
    ".env.example",
    # The container image (docs/reference/cli.md): built by the release workflow from
    # the release tarballs, never from the package.
    "Dockerfile",
    ".dockerignore",
    ".gitattributes",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "clippy.toml",
]

# `cargo binstall judgment`: the `jud` tarball from the GitHub release the
# version was published with (release.yml names them jud-<tag>-<triple>.tar.gz,
# one directory inside), so a Rust user gets the checked binary with no build.
# The crate is `judgment` and the binary `jud`, hence the literal name.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/jud-v{ version }-{ target }.tar.gz"
bin-dir = "jud-v{ version }-{ target }/{ bin }"
pkg-fmt = "tgz"

# docs.rs builds every feature and marks each gated item with the feature that
# turns it on (`#[doc(cfg)]`, enabled by the `docsrs` cfg).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["http"]
# The HTTP client and the retry loop. Without it the crate is the question
# builder, the typed answers and the recordings, for a project that brings its
# own transport.
http = ["dep:reqwest", "dep:tokio", "dep:fastrand", "dep:httpdate", "pacer"]
# `backend::Pacer` and `backend::Paced`: a bound on calls in flight and one
# pause that every call sharing it honours (`docs/guides/bound-a-stream.md`).
# `http` implies it, since the retry loop feeds the pause; without `http`
# it is the one feature that needs tokio, for a semaphore and a timer, so a
# project with its own transport can bound its own calls. Off by default
# with the rest of the crate: `--no-default-features` stays tokio-free.
pacer = ["dep:tokio", "tokio/sync", "tokio/time"]
# `judgment::contract::OPENAPI_DOCUMENT`: the vendored TypeSafe OpenAPI
# document as text, for an application that validates its own traffic against
# the contract the crate is tested against. Off by default: about 25 KB of
# static data a client has no use for at run time.
openapi = []
# `judgment::jud`: the `.jud` document format (a rubric with its policy, a
# cases file, a recording), read and written as YAML. Off by default: a client
# that builds its questions in code has no use for a YAML parser.
jud = ["dep:serde-saphyr"]
# The `jud` binary: the format and the client, parsed by clap. Its own feature
# so that a library build with `jud` (the format) never compiles clap and its
# derive macros for a command line it does not have.
cli = ["jud", "http", "dep:clap", "dep:clap_complete"]
# `CallOptions::multipart` and `ClientBuilder::multipart`: a request's images
# sent as `multipart/form-data` parts beside a JSON `request` part instead of
# base64 in the JSON body, the transport TypeSafe recommends for images. Off
# by default: base64 carries every image the limits allow, and the feature
# pulls in reqwest's multipart encoding and `mime_guess`.
multipart = ["http", "reqwest/multipart", "dep:bytes"]
# `judgment::observer::otel::OtelObserver`: an `Observer` that reports to
# OpenTelemetry metrics, through the OpenTelemetry API crate only. The SDK and
# any exporter stay the application's choice (the `jud` binary's, later).
# Off by default.
otel = ["dep:opentelemetry"]

# `jud::schema`: JSON Schema for the wire shapes of the `.jud` types that are
# serde-shaped, generated by schemars, so a field added to a type and left out
# of schemas/jud/ is a failing test (tests/jud_schema.rs). The published
# schemas stay hand-written. Off by default.
schema = ["jud", "dep:schemars"]
# The `jud` binary with OTLP export (src/bin/jud/telemetry.rs): traces and
# metrics sent over OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT is set, and
# nothing started otherwise. Binary-only: the library names none of these
# crates, and `cargo install judgment --features cli-otel` is the opt-in.
cli-otel = [
    "cli",
    "otel",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
# 1.0.181 is the first with `#[serde(untagged)]` on one variant, which
# `Answer::Unknown` uses.
serde = { version = "1.0.181", features = ["derive"] }
serde_json = "1"
# Questions and Choice options in the order they were written: the model sees
# that order, and a sorted map would send it alphabetically.
indexmap = { version = "2", features = ["serde"] }
# The canonical fingerprint of a request or a document (`eval::canonical`).
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
# YAML for the `.jud` format (feature `jud`). Pure Rust, YAML 1.2, panic-free.
serde-saphyr = { version = "1.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"], optional = true }
# The image parts of a multipart body, sent on every attempt without a copy.
bytes = { version = "1.9", optional = true }
tokio = { version = "1", features = ["time", "rt"], optional = true }
fastrand = { version = "2", optional = true }
# HTTP dates in `Retry-After` (the retry loop).
httpdate = { version = "1", optional = true }
# The `jud` command line (feature `cli`). `clap_complete` generates
# `jud completion <shell>` from the same command tree clap parses with, so a
# completion script cannot drift from the binary; it adds no crate of its own
# beyond the clap already here.
clap = { version = "4", features = ["derive", "env"], optional = true }
clap_complete = { version = "4", optional = true }
# JSON Schema from the wire types (feature `schema`).
schemars = { version = "1", default-features = false, features = ["derive", "std", "indexmap2"], optional = true }
# The OpenTelemetry API (feature `otel`), metrics only: no SDK, no exporter.
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"], optional = true }
# The SDK, the OTLP exporter and the tracing bridge (feature `cli-otel`,
# binary only). Pinned to one release line: the OpenTelemetry crates keep
# global state per version, and deny.toml refuses a second copy. OTLP over
# HTTP with protobuf bodies and rustls, no tonic or gRPC stack.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "trace"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics"], optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"], optional = true }

[dev-dependencies]
# JSON Schema validation in the contract test against the vendored TypeSafe
# OpenAPI document. No default features: nothing fetches a remote `$ref`.
jsonschema = { version = "0.57", default-features = false }
# The contract test reads the committed `.jud` recordings whatever the
# features; the crate's own reader is behind the `jud` feature.
serde-saphyr = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
# A capturing layer in the span tests.
tracing-subscriber = "0.3"
wiremock = "0.6"
# Properties over generated inputs (tests/properties.rs). No default features:
# the fork and timeout machinery is for isolating a crashing test, which a
# pure property does not need. A shrunk failure is saved under
# proptest-regressions/ and replayed first on every later run; commit it.
proptest = { version = "1", default-features = false, features = ["std"] }
# The SDK's in-memory metric exporter, for what `OtelObserver` records
# (tests/otel.rs). Same version as the API crate, so one copy in the graph.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "testing"] }

# The client tests need the HTTP feature; the rest of the crate is tested
# with `--no-default-features` too.
[[test]]
name = "client"
required-features = ["http"]

# What the client records on its spans, through a capturing subscriber layer.
# Its own binary, so the callsite interest cached by one test's subscriber
# cannot hide another test's spans.
[[test]]
name = "spans"
required-features = ["http"]

# What the client reports to the process-wide observer. Its own binary with
# one test, because `observer::set_global` succeeds once per process and any
# other test in the same binary would add to the counts.
[[test]]
name = "observer"
required-features = ["http"]

# The vendored OpenAPI document against the live one; its one test is
# #[ignore] and needs the network but no key (see tests/openapi_drift.rs).
# tests/contract.rs has no entry: it builds and runs without `http` too.
# Generated inputs against the crate's invariants: probabilities, the canonical
# fingerprint, `Response::verify` and the limits on questions. Needs no
# feature, so it runs without the client too.
[[test]]
name = "properties"

# `Paced` over a `Fake`: the bound on calls in flight, the shared pause and the
# permit a dropped call gives back, on tokio's paused clock.
[[test]]
name = "pacer"
required-features = ["pacer"]

# The pause a 429's wait puts on every call of a client that shares a pacer,
# and the observer a client's failed attempts go to.
[[test]]
name = "pacer_client"
required-features = ["http"]

# What `OtelObserver` records through a client, read from the SDK's in-memory
# exporter.
[[test]]
name = "otel"
required-features = ["http", "otel"]

# `judgment.retry.attempts`, from the process-wide observer: a target of its
# own, with one test, as tests/observer.rs is.
[[test]]
name = "otel_global"
required-features = ["http", "otel"]

[[test]]
name = "openapi_drift"
required-features = ["http"]

# Live checks against a real server; every test is #[ignore] (see tests/live.rs).
[[test]]
name = "live"
required-features = ["http"]

# The jud command line as a subprocess, against a wiremock backend.
[[test]]
name = "jud_cli"
required-features = ["cli"]

# The generated schemas against the committed ones (feature `schema`).
[[test]]
name = "jud_schema"
required-features = ["schema"]

# `jud` exporting over OTLP to a stand-in collector (feature `cli-otel`).
[[test]]
name = "jud_otel"
required-features = ["cli-otel"]

# The documentation's code held to the code (docs/project/contributing.md).
[[test]]
name = "docs_examples"
required-features = ["cli"]

# `jud record`, `eval` and `tune` (decision 0021).
[[test]]
name = "jud_record"
required-features = ["cli"]

[[test]]
name = "jud_eval"
required-features = ["cli"]

[[test]]
name = "jud_tune"
required-features = ["cli"]

# `jud split` (decision 0022).
[[test]]
name = "jud_split"
required-features = ["cli"]

# The three together, and the command line's guidance: what `record` writes
# is what `eval` and `tune` read (decision 0021).
[[test]]
name = "jud_loop"
required-features = ["cli"]

# The `.jud` format against its JSON Schemas and its example documents.
[[test]]
name = "jud"
required-features = ["jud"]

# The jud command line (docs/reference/cli.md): `jud RUBRIC` evaluates the JSON state on
# stdin through the client, `jud check` and `jud lower` read documents as the
# crate does. Released as a binary per platform (release.yml).
[[bin]]
name = "jud"
path = "src/bin/jud/main.rs"
required-features = ["cli"]

# The benchmark replay talks to a server, so it needs the client.
[[example]]
name = "typed_decisions"
required-features = ["http"]

# One example per TypeSafe pattern (README, "Patterns"). Each replays its
# recordings under examples/recordings/<name>/ by default and talks to a
# server with --live or --record, so each needs the client; what they share
# (the directory, the modes, the backend) is examples/common/mod.rs. `test = true` makes
# `cargo test` run the test inside each one, which replays the recordings
# and checks the decisions, so a question changed without re-recording fails
# the gate rather than the next reader.
[[example]]
name = "fan_out"
required-features = ["http"]
test = true

[[example]]
name = "confidence_routing"
required-features = ["http"]
test = true

[[example]]
name = "composite_scoring"
required-features = ["http"]
test = true

[[example]]
name = "intent_routing"
required-features = ["http"]
test = true

# The `.jud` round trip (docs/reference/jud-format.md): rubric and cases from files, answers
# replayed from `.jud` recordings, gates tuned and written back. Needs the
# format, not the client.
[[example]]
name = "jud_calibration"
required-features = ["jud"]
test = true

# The README's second example: the quickstart's questions as a `.jud` rubric
# read through its policy; needs the format, not the client.
[[example]]
name = "jud_quickstart"
required-features = ["jud"]

# A rubric wired in as a typed module (`examples/jud/triage.rs`, what the
# plugin's `/jud:rust` writes), answered from the calibration recordings.
[[example]]
name = "jud_typed"
required-features = ["jud"]
test = true

# The README's third example: a rubric from a file, asked of the hosted API;
# needs the format and the client, and a key to run.
[[example]]
name = "jud_live"
required-features = ["jud", "http"]

# Pedantic clippy, no `unwrap` or `expect` outside tests, every public item
# documented: the bar the crate was written to.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# `cfg(kani)` gates the bounded proofs (`#[kani::proof]` harnesses beside the
# code they prove, run with `cargo kani`; docs/guides/record-replay-and-test.md).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
