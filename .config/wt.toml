# worktrunk project config for an agent fleet on this crate: one worktree per
# agent, created and landed by wt, coordinated through pact's shared .pact/ in
# the main checkout. The shape follows pact's own
# docs/studies/worktrunk.md ("How it should be wired"), adjusted to what this
# repository's first fleet run measured (pact audit over the y7a wave,
# 2026-10-27: 122 events, 9 agents, 40 holds).
#
# Project hooks and aliases run only after a human approves this file once
# (`wt config approvals add`). Agents never pass `--yes`: it approves whatever
# the invoking worktree's copy of this file says, and that copy is on the
# agent's own branch. Lease this file like any shared file; it is the
# orchestrator's.

# ---------------------------------------------------------------------------
# Creating a worktree
# ---------------------------------------------------------------------------

[step.copy-ignored]
# A new worktree must NOT receive a copy of the fleet's shared or private
# state:
# - .pact/ and .beads/ resolve to the main checkout from every worktree; a
#   copy is a second store nobody coordinates through (`pact doctor` reports
#   it as "worktree carries copied state"), and a copied Dolt database is the
#   second bd store this repo's memories already warn about.
# - target is a symlink into mbx's store (mise.toml wraps cargo): copying the
#   link points every worktree at ONE build directory, the lock contention mbx
#   exists to avoid. Excluded, each worktree gets its own managed target,
#   restored warm from the shared cache.
# - .env holds the live API keys; a fleet worktree never needs them (tests are
#   wiremock, Fake and recordings; live runs are by hand from the main
#   checkout), so the keys stay in one place.
# - .venv and .remember are per-machine working state, not inputs to a build.
exclude = [".pact/", ".beads/", "target", ".env", ".venv/", ".remember/"]

[[post-start]]
# mise trusts config by path, and a worktree is a new path. Then install what
# mise.toml pins: the post-checkout advice this repo already gives ("run mise
# install before a mise exec stops to compile them"), done before the agent
# starts instead of after it stalls.
trust = "mise trust && mise install --quiet"

[[post-start]]
# This repository's git hooks live in .beads/hooks (core.hooksPath) and run
# `bd hooks run` on every commit. In a linked worktree that bootstraps a
# second Dolt store from the checked-out export and rewrites issues.jsonl on
# the agent's branch — the y7a fleet had to commit --no-verify to avoid it.
# Disable hooks for this worktree only; the main checkout keeps them, and the
# full gate (mise run check) covers what prek would have checked, at
# integration, as the fleet pattern already does.
hooks = "git config extensions.worktreeConfig true && git config --worktree core.hooksPath /dev/null"

[[post-start]]
# Record which agent owns this worktree, for the Agent column (user config)
# and for `wt list` readers with no PACT_AGENT in their shell. `wt spawn`
# exports it; a worktree created another way records nothing.
agent = "[ -z \"$PACT_AGENT\" ] || wt config state vars set agent=\"$PACT_AGENT\""
# Warm the test targets from mbx's store while the agent reads its inbox and
# the lease table (the protocol's first steps, longer than this takes). A
# build the agent starts meanwhile waits on cargo's directory lock, then
# restores.
warm = "mise exec -- cargo test --no-run --quiet --all-features"

# ---------------------------------------------------------------------------
# Landing and removing
# ---------------------------------------------------------------------------

# No pre-merge test gate, on purpose. A gate here is absolute: it asks whether
# the tests pass, not whether THIS merge broke them, so one red commit on main
# blocks every landing until someone fixes it (the livelock pact merge
# --verify was rewritten to escape). The y7a fleet's landing — the
# orchestrator merges each branch and runs `mise run check` once on the
# integrated result — stays the default here; `wt land` below is the
# agent-side alternative for a main kept green by CI.

[pre-remove]
# A branch that still holds pact leases is a claim about to outlive its agent
# by a whole TTL. Refuse, as wt refuses a dirty tree, and name the holder. The
# merge mutex under .pact/internal/ is not a file lease and is excluded so a
# landing can clean up after itself. Under `wt merge` this runs AFTER the
# fast-forward, so a refusal keeps the worktree but the work has landed.
# Override, for a holder you know is gone: `pact lease release --force`, or
# `wt remove --no-hooks`.
pact-leases = """
command -v pact >/dev/null || exit 0
held=$(pact lease ls --json | jq -r --arg b '{{ branch }}' \
  '.[] | select(.lease.branch == $b and (.lease.path | startswith(".pact/internal/") | not)) | "  \\(.lease.path)  held by \\(.lease.agent)"')
[ -z "$held" ] || { printf 'branch %s still holds pact leases:\\n%s\\n' '{{ branch }}' "$held" >&2; exit 1; }
"""

# ---------------------------------------------------------------------------
# Aliases
# ---------------------------------------------------------------------------

[aliases]
# Start an agent in its own worktree, with pact's identity in its environment:
#   wt spawn --agent=y7a-core --model=claude-sonnet-5-5 -- -p "<prompt>"
# Branch and agent share the name, so the "one identity, one worktree" rule
# holds by construction: two worktrees under one PACT_AGENT both acquire the
# same path with exit 0, and the audit cannot tell them apart. Run each spawn
# in its own pane: -x holds the terminal. Everything after `--` goes to
# claude. A Claude Code subagent spawned any other way inherits its parent's
# environment, so its prompt must carry the identity and every pact command it
# runs passes --agent <name> (an export does not survive between its shells) —
# that is how the y7a fleet ran, and its audit attributes all 9 agents. The
# cost of that route, measured by recount: every event keys to the PARENT's
# harness session, so no agent's ledger row can be joined to its own
# transcript with confidence (nine agents, one session id). An agent spawned
# through this alias is its own top-level session whose cwd IS its worktree,
# which gives recount a keyed, discriminating join instead of a lead.
spawn = """
PACT_AGENT='{{ agent }}' BEADS_ACTOR='{{ agent }}' PACT_HARNESS=claude-code \
{% if model %}PACT_MODEL='{{ model }}' {% endif %}\
wt switch --create '{{ agent }}' --no-cd -x claude -- {{ args }}
"""

# Land this worktree's branch from inside it, serialised by the same mutex an
# orchestrator-side merge takes, with nothing committed or squashed on the
# agent's behalf: a squash writes one new commit and drops every Pact-Agent
# trailer with it, which is 2 of 2 commits unattributed in the study's
# measurement. COMMIT BEFORE YOU RELEASE, then release your file leases before
# landing — the y7a audit's eleven uncovered commits are exactly the ones made
# after `pact lease release --all` — and the pre-remove guard refuses a branch
# still holding leases.
#   wt land            # rebase, fast-forward, remove
#   wt land --no-rebase
# The mutex release runs from the main checkout, on purpose: `wt merge`
# deletes the invoking worktree in the background, and a release started from
# a directory being deleted finds no repository and leaves the mutex held for
# its whole TTL (measured in pact's study). Landing advances the LOCAL main
# only; pushing main stays a human step here (the Bash guard denies it to
# agents).
land = """
m='.pact/internal/merge-to-{{ default_branch }}'
pact lease acquire "$m" --wait 30m --ttl 30m --note "wt merge --no-commit {{ branch }}" || exit $?
wt merge --no-commit {{ args }}; s=$?
cd '{{ repo_path }}' && pact lease release "$m"
exit $s
"""
