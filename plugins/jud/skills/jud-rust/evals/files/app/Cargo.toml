# A small program the evals generate modules into. `run.py` points the
# judgment dependency at the checkout under test.
[package]
name = "app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
judgment = { path = "JUDGMENT_PATH", features = ["jud"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
