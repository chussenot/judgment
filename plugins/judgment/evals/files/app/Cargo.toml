# A small support service the evals work in: a triage decision with one
# test and a planted bug, and a batch job that fans out calls with no pacer
# and counts tokens by hand. `run.py` points the judgment dependency at the
# checkout under test.
[package]
name = "app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
judgment = { path = "JUDGMENT_PATH" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
wiremock = "0.6"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
